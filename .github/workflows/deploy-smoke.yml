name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to test
        required: true
        type: choice
        options: [staging, production]
      base_url:
        description: Deployment origin, including https://
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
      - run: npm ci
      - name: Run non-mutating deployment checks
        run: npm run smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
